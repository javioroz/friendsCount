# Nixpacks build plan.
#
# Railway ran a plan containing only `build` and `start`, so the Node
# toolchain was never installed and `npm run build:server` died with
# `npm: command not found` (exit code 127). Declaring setup and install
# explicitly makes the build independent of autodetection.

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
# NODE_ENV=production makes npm omit devDependencies; typescript is needed
# for build:server, so force dev deps in.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build:server"]

[start]
cmd = "node server/dist/index.js"
